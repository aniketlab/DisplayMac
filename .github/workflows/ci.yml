name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  android:
    name: Android Client (Test, Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Unit Tests, Lint & Assemble Debug APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug

  macos:
    name: macOS Host (Swift Build/Test, CoreAudio Driver & Shellcheck)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build & Test macos-server
        working-directory: macos-server
        run: |
          swift build
          swift test
      - name: Verify Universal CoreAudio HAL Driver Compilation
        working-directory: macos-server
        run: |
          SDK_PATH="$(xcrun --show-sdk-path)"
          clang -bundle -arch arm64 -arch x86_64 -isysroot "$SDK_PATH" -O3 \
            -DkNumber_Of_Channels=2 \
            -DkDriver_Name=\"DisplayMacAudio\" \
            -DkDevice_Name=\"DisplayMacAudio\" \
            -DkManufacturer_Name=\"DisplayMac\" \
            -DkHas_Driver_Name_Format=false \
            -DkPlugIn_BundleID=\"com.displaymac.audio\" \
            -framework CoreAudio -framework CoreFoundation -framework AudioToolbox -framework Accelerate \
            -o /tmp/DisplayMacAudio Driver/DisplayMacAudio.c
      - name: Lint Shell Scripts
        run: shellcheck install.sh uninstall.sh stop_server.sh macos-server/*.sh scripts/*.sh
